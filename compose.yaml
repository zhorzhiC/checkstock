name: checkstock
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkstock-local-only}
      POSTGRES_DB: checkstock
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:${POSTGRES_PASSWORD:-checkstock-local-only}@db:5432/checkstock
      DEMO_SEED: ${DEMO_SEED:-true}
    volumes:
      - ./app/static:/app/app/static:ro
      - ./app/templates:/app/app/templates:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
